name: Trading Bot Hourly Scan

on:
  # schedule:
  #   - cron: '0 * * * *'  # Aktifkan baris ini jika ingin otomatis jalan setiap jam
  workflow_dispatch:     # Agar bisa dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install ccxt pandas requests python-telegram-bot; fi

      # 1. Main Bot (Filter Pasangan / Scanner)
      - name: Run Main Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      # 2. Bot SMC Standalone
      - name: Run SMC Paper Trader
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python paper_trader_smc.py

      # 3. Bot Teknikal Standalone
      - name: Run Technical Paper Trader
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python paper_trader_tech.py

      # 4. Bot AGR Hybrid Standalone (Mandiri, hitung logika sendiri)
      - name: Run AGR Hybrid Paper Trader
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python paper_trader_agr.py

      # 5. Commit & Push semua file JSON state paper trading ke Repo
      - name: Save All Paper Trading States
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add *.json || true
          git commit -m "Auto-update status paper trading [skip ci]" || true
          git push || true
